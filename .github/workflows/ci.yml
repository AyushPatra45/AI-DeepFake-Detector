name: Repository verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Run Ruff
        run: python -m ruff check backend evaluation scripts

      - name: Run tests
        run: python -m pytest

      - name: Check patch whitespace
        run: git diff --check
