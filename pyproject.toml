[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-deepfake-detector"
version = "0.1.0"
description = "Deepfake and steganography forensic analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "python-multipart>=0.0.12,<1",
  "reportlab>=4.2,<5",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["backend"]
testpaths = ["backend/tests", "evaluation/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
